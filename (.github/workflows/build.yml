name: Build PKG
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm make

      - name: Get toolchain
        run: |
          mkdir -p $HOME/oo
          curl -sL https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/v0.5.4.tar.gz -o oo.tar.gz
          tar -xzf oo.tar.gz -C $HOME/oo
          TC=$(dirname "$(find $HOME/oo -name setup-project.sh | head -1)")
          echo "Toolchain at: $TC"
          ls "$TC"
          chmod -R +x "$TC/bin/linux"
          echo "OO_PS4_TOOLCHAIN=$TC" >> $GITHUB_ENV

      - name: Build sample
        run: |
          cp -r "$OO_PS4_TOOLCHAIN/samples/hello_world" $HOME/test
          cd $HOME/test
          make

      - name: Collect PKG
        run: |
          mkdir -p out
          find $HOME/test -name "*.pkg" -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: test-pkg
          path: out/*.pkg
